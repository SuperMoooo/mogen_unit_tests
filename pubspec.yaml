name: mogen_unit_tests
description: Scans Riverpod AsyncNotifier classes and auto-generates Mocktail unit tests.
version: 1.1.1
homepage: https://supermoooo.github.io/Portfolio/
repository: https://github.com/SuperMoooo/mogen_unit_tests
environment:
    sdk: '>=3.4.0 <4.0.0'

dependencies:
    analyzer: '>=10.0.0 <14.0.0'
    args: ^2.4.2
    dart_style: ^3.1.3
    glob: ^2.1.2
    path: ^1.9.0
    yaml: ^3.1.2

dev_dependencies:
    lints: ^4.0.0
    test: ^1.24.0

executables:
    mogen_unit_tests: mogen_unit_tests
